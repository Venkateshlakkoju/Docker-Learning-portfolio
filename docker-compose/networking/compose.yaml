services:
  web:
    image: nginx:alpine
    ports:
      - "8090:80"
    networks:
      - frontend

  app:
    image: alpine
    command: sh -c "while true; do sleep 3600; done"
    networks:
      - frontend
      - backend

  database:
    image: alpine
    command: sh -c "while true; do sleep 3600; done"
    networks:
      - backend

networks:
  frontend:
  backend:
